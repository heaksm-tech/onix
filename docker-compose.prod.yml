# Production-ish stack: compiled images, no bind mounts, migrations run as a
# separate one-shot service that must succeed before the API starts.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - onix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./apps/api
      target: runner
    command: npm run migrate:up
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./apps/api
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # No browser reaches this API cross-origin, so no origin is allowed.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      # Public web origin is required because it is embedded in invitations.
      APP_URL: ${APP_URL:?required}
      ACCOUNT_INVITATION_TTL_HOURS: ${ACCOUNT_INVITATION_TTL_HOURS:-48}
      # Session cookies are Secure by default in production. What matters is
      # how the browser reaches the *web* app — set this to false if that is
      # plain HTTP, or the browser will discard the cookie.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Production sends to the account itself, from the verified-domain
      # address below. Both are required by compose and validated again by the API.
      RESEND_API_KEY: ${RESEND_API_KEY:?required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?required}
    # Deliberately no `ports`: the API is reachable only from the web service
    # over the compose network. Publishing it would put an internet-facing
    # surface next to the one the web app already guards.
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:4000/api/v1
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

volumes:
  onix-pgdata:
