# Development stack. `docker compose up` builds and runs everything.
# Source is bind-mounted, so both services hot-reload on save.

services:
  postgres:
    image: postgres:17-alpine
    container_name: onix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onix}
      POSTGRES_DB: ${POSTGRES_DB:-onix_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - onix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-onix} -d ${POSTGRES_DB:-onix_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    container_name: onix-api
    restart: unless-stopped
    # Apply pending migrations, then start the watcher.
    command: sh -c "npm run migrate:up && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://${POSTGRES_USER:-onix}:${POSTGRES_PASSWORD:-onix}@postgres:5432/${POSTGRES_DB:-onix_dev}
      # Empty: no browser calls this API cross-origin. See apps/api/.env.example.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      # Public browser origin used in invitation emails. If WEB_PORT changes,
      # set APP_URL alongside it so the link still reaches the web service.
      APP_URL: ${APP_URL:-http://localhost:3000}
      ACCOUNT_INVITATION_TTL_HOURS: ${ACCOUNT_INVITATION_TTL_HOURS:-48}
      # Development uses Resend's test sender but delivers to the account email.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      # Published in development so you can curl the API directly. The
      # production stack deliberately does not publish it.
      - "${API_PORT:-4000}:4000"
    volumes:
      # Bind-mount the source for hot reload, but keep the image's node_modules
      # (built for the container's platform) from being shadowed by the host's.
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  reminder-worker:
    build:
      context: ./apps/api
      target: dev
    container_name: onix-reminder-worker
    restart: unless-stopped
    command: npm run dev:reminders
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://${POSTGRES_USER:-onix}:${POSTGRES_PASSWORD:-onix}@postgres:5432/${POSTGRES_DB:-onix_dev}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      target: dev
    container_name: onix-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # The only address of the API anywhere in the web app. Browser code goes
      # through this app's /api/v1 route, so it is never told where the API is.
      API_URL: http://api:4000/api/v1
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  onix-pgdata:
